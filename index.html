<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>拜毯</title>
    <meta name="description" content="五番拜时间、在家礼拜指引、小净、朝向与赞念。不用注册，不收集个人信息。" />
    <meta name="theme-color" content="#0f5940" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      /* 首屏占位：脚本加载前就有底色和标题，避免白屏 */
      html { background: #f7f2e6; }
      @media (prefers-color-scheme: dark) { html { background: #0f1a16; } }
      .boot { min-height: 100vh; display: grid; place-items: center; font: 600 20px/1.6 "PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif; color: #0f5940; }
      /* 启动画面：打开应用时先显示图标和名称（脚本还没加载就能显示）。最多 4.5 秒后自己消失，脚本出错也不会卡住 */
      .splash { display: none; }
      .splash.is-on { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: #0f5940; color: #f7f2e6; text-align: center; -webkit-animation: splash-auto 0.4s 4.5s forwards; animation: splash-auto 0.4s 4.5s forwards; }
      .splash.is-out { opacity: 0; transition: opacity 0.45s ease; pointer-events: none; }
      .splash-bism { margin: 0 0 28px; color: #d9b65e; font-size: 22px; line-height: 1.8; opacity: 0.95; }
      .splash-mark { width: 112px; height: 112px; -webkit-animation: splash-in 0.7s ease-out both; animation: splash-in 0.7s ease-out both; }
      .splash-mark svg { width: 100%; height: 100%; display: block; }
      .splash-name { margin: 22px 0 6px; font: 700 34px/1.2 "Noto Serif","PingFang SC","Times New Roman",serif; letter-spacing: 0.02em; -webkit-animation: splash-up 0.6s 0.25s ease-out both; animation: splash-up 0.6s 0.25s ease-out both; }
      .splash-tag { margin: 0; color: #cfe3d8; font: 500 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-animation: splash-up 0.6s 0.45s ease-out both; animation: splash-up 0.6s 0.45s ease-out both; }
      .splash-foot { position: absolute; bottom: 28px; bottom: calc(28px + env(safe-area-inset-bottom)); left: 0; right: 0; color: #9cc4b0; font: 400 13px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
      @-webkit-keyframes splash-in { from { -webkit-transform: scale(0.82); opacity: 0; } to { -webkit-transform: none; opacity: 1; } }
      @keyframes splash-in { from { transform: scale(0.82); opacity: 0; } to { transform: none; opacity: 1; } }
      @-webkit-keyframes splash-up { from { -webkit-transform: translateY(10px); opacity: 0; } to { -webkit-transform: none; opacity: 1; } }
      @keyframes splash-up { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
      @-webkit-keyframes splash-auto { to { opacity: 0; visibility: hidden; } }
      @keyframes splash-auto { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { .splash-mark, .splash-name, .splash-tag { -webkit-animation: none; animation: none; } }
    </style>
  </head>
  <body>
    <div class="splash" id="splash" aria-hidden="true">
      <p class="splash-bism" lang="ar" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</p>
      <div class="splash-mark"><svg viewBox="300 300 424 424" aria-hidden="true"><g fill="none" stroke="#d9b65e" stroke-width="22" stroke-linejoin="round"><rect x="362" y="362" width="300" height="300"/><rect x="362" y="362" width="300" height="300" transform="rotate(45 512 512)"/></g><path d="M446 612V538Q446 482 512 466Q578 482 578 538V612Z" fill="#d9b65e"/><path d="M512 466V436" stroke="#d9b65e" stroke-width="11"/><circle cx="512" cy="428" r="10" fill="#d9b65e"/></svg></div>
      <p class="splash-name">Ҷойнамоз</p>
      <p class="splash-tag"></p>
      <p class="splash-foot"></p>
    </div>
    <script id="splash-js">
      // 启动画面的文字按语言显示；第一次打开停 2.6 秒，以后 1.4 秒（main.js 读 window.__splash 决定何时淡出）。
      // 自动化测试（navigator.webdriver）里不显示，免得挡住页面。__DEFAULT_LANG__ 构建时换成 src/i18n 里的默认语言。
      (function () {
        var s = document.getElementById('splash');
        if (!s || navigator.webdriver) return;
        var lang = '', seen = false;
        try {
          var st = JSON.parse(localStorage.getItem('masjid:settings') || 'null');
          if (st) lang = st.lang || '';
          seen = !!localStorage.getItem('masjid:opened');
          localStorage.setItem('masjid:opened', '1');
        } catch (e) {}
        if (!lang) {
          var list = navigator.languages || [navigator.language || ''];
          for (var i = 0; i < list.length && !lang; i++) {
            var p = String(list[i] || '').toLowerCase().slice(0, 2);
            if (p === 'tg' || p === 'ru' || p === 'zh') lang = p;
          }
        }
        var T = {
          tg: ['Ҷойнамоз', 'Вақти намоз · Намоз дар хона', 'Бепул · бе бақайдгирӣ · бе интернет ҳам кор мекунад'],
          ru: ['Джойнамоз', 'Время намаза · Намаз дома', 'Бесплатно · без регистрации · работает без интернета'],
          zh: ['拜毯', '礼拜时间 · 在家礼拜', '免费 · 不用注册 · 没网也能用']
        };
        var x = T[lang] || T['__DEFAULT_LANG__'] || T.tg;
        s.querySelector('.splash-name').textContent = x[0];
        s.querySelector('.splash-tag').textContent = x[1];
        s.querySelector('.splash-foot').textContent = x[2];
        s.className += ' is-on';
        window.__splash = { t0: Date.now(), min: seen ? 1400 : 2600 };
      })();
    </script>
    <a class="skip" href="#app">跳到正文</a>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="拜毯 首页">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">拜毯</span>
      </a>
      <nav class="topnav" aria-label="主导航"></nav>
      <a class="topbar-settings" href="#/settings" aria-label="设置"></a>
    </header>
    <main id="app" tabindex="-1"><div class="boot" aria-hidden="true"></div></main>
    <nav class="tabbar" aria-label="主导航"></nav>
    <div class="toast-layer" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
