# 部署后台（大殿在线人数、亲友圈、远程公告、匿名统计）到 Cloudflare。手动运行：仓库 Actions → 部署后台 → Run workflow。
# 第一次使用前，在仓库 Settings → Secrets and variables → Actions → Secrets 里加（步骤见 docs/后台部署步骤.md）：
#   CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID —— 必填
#   ADMIN_TOKEN（至少 24 位的随机口令）、ADMIN_TOTP（两步验证密钥）、CONFIG_PUBLIC_KEY（配置签名公钥）—— 有就一起存到服务器
# 仓库是公开的：机密只通过环境变量传给 wrangler，绝不打印到日志里。
name: 部署后台

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 后台测试（防火墙、签名配置、匿名统计、房间、亲友圈）
        run: npm i --no-save miniflare@3.20250718.3 && npm run test:server
      - name: 部署
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.2 deploy
      - name: 存机密（只存填了的那几样）
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ADMIN_TOTP: ${{ secrets.ADMIN_TOTP }}
          CONFIG_PUBLIC_KEY: ${{ secrets.CONFIG_PUBLIC_KEY }}
        run: |
          for name in ADMIN_TOKEN ADMIN_TOTP CONFIG_PUBLIC_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4.156.2 secret put "$name" > /dev/null
              echo "已存：$name"
            else
              echo "没填，跳过：$name"
            fi
          done
