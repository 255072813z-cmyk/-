# 合并到 main 后自动发布到 GitHub Pages。
# 第一次使用前：仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
name: 发布网站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 测试（时区无关、拜数、念词、红线）
        run: npm test
      - name: 礼拜时间全年天文核对
        run: npm run check:astro
      - name: 后台服务测试（防火墙、签名配置、匿名统计、房间）
        run: npm i --no-save miniflare@3.20250718.3 && npm run test:server
      - run: npm run build
        env:
          # 在线人数服务地址（仓库 Settings → Secrets and variables → Actions → Variables）；不设就不显示人数
          VITE_PRESENCE_URL: ${{ vars.VITE_PRESENCE_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CONFIG_PUBKEY: ${{ vars.VITE_CONFIG_PUBKEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
